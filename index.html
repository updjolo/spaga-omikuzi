<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER☆GiRLS 今日のラッキーメンバー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff6b9d;
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #f0fff0 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #4a3e43;
      --member-color: #ff6b9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(255, 107, 157, 0.15), 0 2px 10px rgba(0, 0, 0, 0.03);
      text-align: center;
      border: 3px solid #ffffff;
      position: relative;
    }

    .header-tag {
      display: inline-block;
      background: linear-gradient(90deg, #ff6b9d, #ff8da1);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(255, 107, 157, 0.2);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #ff3377;
      margin-bottom: 6px;
    }

    .date-display {
      font-size: 0.9rem;
      color: #88787e;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .card-slot {
      background: #ffffff;
      border: 3px dashed #ffb6c1;
      border-radius: 20px;
      padding: 28px 20px;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      pointer-events: none;
    }

    .card-slot.revealed {
      border-style: solid;
      border-color: var(--member-color);
      background: linear-gradient(180deg, #ffffff 0%, #fff5f8 100%);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      pointer-events: auto;
    }

    .card-slot.revealed:hover {
      transform: translateY(-3px);
    }

    .member-icon {
      font-size: 3.2rem;
      margin-bottom: 10px;
    }

    .member-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--member-color);
      margin-bottom: 4px;
      transition: color 0.3s ease;
    }

    .member-handle {
      font-size: 0.85rem;
      color: #88787e;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .fortune-msg {
      font-size: 0.95rem;
      color: #5a4b50;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-draw {
      background: linear-gradient(90deg, #ff6b9d, #ff4785);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35);
      margin-bottom: 12px;
    }

    .btn-draw:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 107, 157, 0.45);
    }

    .btn-profile {
      display: none;
      background: var(--member-color);
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: background 0.3s ease;
    }

    .btn-profile:hover {
      filter: brightness(0.95);
    }

    .btn-share {
      display: none;
      background: #000000;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .btn-share:hover {
      background: #222222;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #b0a0a5;
    }

    .sparkle {
      display: inline-block;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="header-tag">SUPER☆GiRLS</span>
    <h1>TODAY'S LUCKY MEMBER</h1>
    <div class="date-display" id="dateDisplay">----.--.--</div>

    <a id="cardSlot" class="card-slot" target="_blank" rel="noopener noreferrer">
      <div class="member-icon" id="cardIcon">🎀</div>
      <div class="member-name" id="cardTitle">今日のおみくじ</div>
      <div class="member-handle" id="cardHandle">ボタンを押して運勢を占おう！</div>
      <div class="fortune-msg" id="cardMsg">何度でもチャレンジできます ✨</div>
    </a>

    <button class="btn btn-draw" id="drawBtn" onclick="drawFortune()">
      <span class="sparkle">✨</span> <span id="drawBtnText">運勢を占う！</span>
    </button>

    <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-profile" id="profileBtn">
      🚀 公式Xプロフィールを開く
    </a>

    <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-share" id="shareBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      結果をXにポストする
    </a>

    <div class="footer">Created by レッセフェール</div>
  </div>

  <script>
    const MEMBERS = [
      { name: "門林 有羽", url: "https://x.com/SG4_YUU", handle: "@SG4_YUU", color: "#38bdf8", msg: "笑顔いっぱいの素敵な出来事がありそう！ハッピーに過ごそう♪" },
      { name: "竹内 ななみ", url: "https://x.com/SG5_nanami", handle: "@SG5_nanami", color: "#ef4444", msg: "あなたのリーダーシップが光る一日！思い切って行動しよう！" },
      { name: "鎌田 彩華", url: "https://x.com/SG6_AYAKA_avex", handle: "@SG6_AYAKA_avex", color: "#5c6bc0", msg: "センス抜群の一日！クリエイティブなことに挑戦してみて！" },
      { name: "柏 綾菜", url: "https://x.com/SG6_AYANA_avex", handle: "@SG6_AYANA_avex", color: "#c084fc", msg: "元気いっぱいに過ごせそう！エネルギー全開でいこう！" },
      { name: "河村 果歩", url: "https://x.com/SG6_KAHO_avex", handle: "@SG6_KAHO_avex", color: "#64748b", msg: "ハッピーなサプライズがあるかも！周りを明るく照らそう！" },
      { name: "櫻井 穂夏", url: "https://x.com/SG6_HONOKA_avex", handle: "@SG6_HONOKA_avex", color: "#22c55e", msg: "自然体でいくのが吉！心穏やかに素晴らしい一日を！" },
      { name: "浜田 萌帆", url: "https://x.com/SG7_MOYUHO", handle: "@SG7_MOYUHO", color: "#ff69b4", msg: "トキメキが溢れる一日！可愛いものを身につけて運気UP！" },
      { name: "二宮 伶寧", url: "https://x.com/SG7_RUNE", handle: "@SG7_RUNE", color: "#a3e635", msg: "最高にツイてる一日！ラッキーアイテムはイチゴスイーツ🍓" }
    ];

    function getTodayDisplay() {
      const now = new Date();
      return `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    }

    document.getElementById('dateDisplay').textContent = getTodayDisplay();

    let isSpinning = false;

    function drawFortune() {
      if (isSpinning) return;
      isSpinning = true;

      const drawBtn = document.getElementById('drawBtn');
      const drawBtnText = document.getElementById('drawBtnText');
      const cardSlot = document.getElementById('cardSlot');
      const cardIcon = document.getElementById('cardIcon');
      const cardTitle = document.getElementById('cardTitle');
      const cardHandle = document.getElementById('cardHandle');
      const cardMsg = document.getElementById('cardMsg');
      const profileBtn = document.getElementById('profileBtn');
      const shareBtn = document.getElementById('shareBtn');

      drawBtn.disabled = true;
      drawBtn.style.opacity = '0.7';

      let shuffleCount = 0;
      const maxShuffles = 15;

      const interval = setInterval(() => {
        const tempMember = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];
        cardTitle.textContent = tempMember.name;
        cardHandle.textContent = tempMember.handle;
        document.documentElement.style.setProperty('--member-color', tempMember.color);
        shuffleCount++;

        if (shuffleCount >= maxShuffles) {
          clearInterval(interval);
          revealResult();
        }
      }, 80);

      function revealResult() {
        const luckyMember = MEMBERS[Math.floor(Math.random() * MEMBERS.length)];

        document.documentElement.style.setProperty('--member-color', luckyMember.color);
        cardSlot.classList.add('revealed');
        cardSlot.href = luckyMember.url;

        cardIcon.textContent = '✨';
        cardTitle.textContent = luckyMember.name;
        cardHandle.textContent = luckyMember.handle;
        cardMsg.textContent = luckyMember.msg;

        // Configure profile jump button
        profileBtn.href = luckyMember.url;
        profileBtn.style.display = 'flex';

        // Configure X share button
        const tweetText = `🎀 今日のSUPER☆GiRLSラッキーメンバーは……\n\n✨ ${luckyMember.name} さん (${luckyMember.handle}) ✨\n\n${luckyMember.msg}\n\n#スパガ #SUPERGiRLS #今日のラッキーメンバー`;
        shareBtn.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
        shareBtn.style.display = 'flex';

        // Enable repeated drawing
        drawBtn.disabled = false;
        drawBtn.style.opacity = '1';
        drawBtnText.textContent = 'もう一度占う！';
        isSpinning = false;
      }
    }
  </script>
</body>
</html>
